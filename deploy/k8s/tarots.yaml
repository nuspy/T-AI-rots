# Notifiche push (v9, Fase 5): ogni 15 minuti. Prima le automatiche la cui finestra è aperta all'ora LOCALE di chi
# riceve (carta del giorno all'ora scelta, serie in pericolo, benvenuto, rinnovo non riuscito, fine della prova), fuori
# dalle ore di silenzio; poi le campagne della console arrivate all'ora. FCM (app) con il service account di Firebase
# caricato in console; Web Push (sito) con le chiavi VAPID generate e cifrate dal sito: serve solo la chiave master.
# Idempotente (registro `invii_notifica` con indici unici): un giro ripetuto non rimanda niente.
# Prova a mano: kubectl -n tarots create job --from=cronjob/tarots-notifiche prova-notifiche
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tarots-notifiche
  namespace: tarots
  labels: {app: tarots, component: notifiche}
spec:
  schedule: "*/15 * * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 840
      template:
        metadata:
          labels: {app: tarots, component: notifiche}
        spec:
          restartPolicy: Never
          containers:
            - name: notifiche
              image: tarots-api:v9.5
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "tarot_core.tools.notifiche"]
              env:
                - name: TAROT_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: database-url}}
                - {name: TAROT_ENVIRONMENT, value: prod}
                - {name: TAROT_AUTH_DISABLED, value: "false"}
                - {name: TAROT_BILLING_PROVIDER, value: disattivato}
                - {name: TAROT_TRACING_ENABLED, value: "false"}
                # Il link d'apertura e la disiscrizione puntano all'API pubblica; il tocco apre il sito.
                - {name: TAROT_WEB_PUBLIC_URL, value: "https://tarots.chat"}
                - {name: TAROT_API_PUBLIC_URL, value: "https://tarots.chat/api"}
                # Richiesti dal controllo di produzione; la chiave master decifra Firebase, VAPID e la firma dei link.
                - name: TAROT_CONDIVISIONE_SALE
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: condivisione-sale, optional: true}}
                - name: TAROT_LLM_PROVIDER_KEY
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: llm-provider-key}}
              resources:
                requests: {cpu: 20m, memory: 96Mi}
                limits: {memory: 384Mi}
---
