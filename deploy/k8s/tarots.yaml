# T-AI-rots su k3s: namespace `tarots`, sotto un solo dominio (tarots.tadamoo.com).
#
#   /        -> sito Next.js          (tarots-web:3000)
#   /api/    -> API FastAPI           (tarots-api:8100, il prefisso /api si toglie)
#   /admin   -> console admin         (tarots-admin:3000, Next.js con basePath /admin)
#   /auth/   -> Keycloak              (tarots-keycloak:8080, KC_HTTP_RELATIVE_PATH=/auth)
#
# Il dominio è uno solo perché il DNS ha solo `tarots.tadamoo.com`. Davanti a
# tutto sta nginx-proxy-manager (TLS Let's Encrypt), che inoltra l'intero host
# al servizio `tarots-gateway:8080`: le regole di percorso vivono qui, in un
# posto solo, e non nella console di NPM.
#
# Non contiene segreti: `tarots-secrets` e `tarots-realm` si creano a parte
# (vedi deploy/k8s/LEGGIMI.md). Le immagini si costruiscono sul server e si
# importano in containerd: non c'è un registry (come per autoskill).

apiVersion: v1
kind: Namespace
metadata:
  name: tarots
---
# ---------------------------------------------------------------- gateway ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tarots-gateway
  namespace: tarots
data:
  default.conf: |
    # NPM ha già terminato il TLS: lo schema originale arriva in X-Forwarded-Proto.
    map $http_x_forwarded_proto $schema_originale {
      default $http_x_forwarded_proto;
      ""      $scheme;
    }

    server {
      listen 8080;
      server_name _;
      client_max_body_size 5m;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $schema_originale;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Real-IP $http_x_real_ip;

      # La console di Keycloak e il realm master non sono pubblici: si usano
      # con `kubectl -n tarots port-forward deploy/tarots-keycloak 8081:8080`.
      location ~ ^/auth/(admin|realms/master)(/|$) {
        return 403;
      }

      location /auth/ {
        proxy_pass http://tarots-keycloak:8080;
        # Le intestazioni dei token di Keycloak sono grosse.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
      }

      # Il responso arriva a pezzi (streaming): senza `proxy_buffering off`
      # comparirebbe tutto insieme alla fine.
      location /api/ {
        proxy_pass http://tarots-api:8100/;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }

      # La console di amministrazione: un'altra app Next.js, costruita con
      # basePath /admin, quindi il percorso passa com'è.
      location ~ ^/admin(/|$) {
        proxy_pass http://tarots-admin:3000;
      }

      location / {
        proxy_pass http://tarots-web:3000;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-gateway
  namespace: tarots
  labels: {app: tarots, component: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tarots, component: gateway}
  template:
    metadata:
      labels: {app: tarots, component: gateway}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: conf
          configMap: {name: tarots-gateway}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-gateway
  namespace: tarots
  labels: {app: tarots, component: gateway}
spec:
  type: ClusterIP
  selector: {app: tarots, component: gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# --------------------------------------------------------------- keycloak ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-keycloak
  namespace: tarots
  labels: {app: tarots, component: keycloak}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: tarots, component: keycloak}
  template:
    metadata:
      labels: {app: tarots, component: keycloak}
    spec:
      containers:
        - name: keycloak
          # deploy/keycloak/Dockerfile: Keycloak 26 già costruito per Postgres,
          # health e percorso /auth. Costruito sul server, senza registry.
          image: tarots-keycloak:v1
          imagePullPolicy: IfNotPresent
          # `start` (produzione), non `start-dev`: database vero, HTTPS dietro proxy.
          args: ["start", "--optimized", "--import-realm"]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://postgresql.tadamoo.svc.cluster.local:5432/tarots"}
            # Lo stesso database dell'API, in uno schema suo: un solo utente, un solo database.
            - {name: KC_DB_SCHEMA, value: keycloak}
            - {name: KC_DB_USERNAME, value: tarots}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: db-password}}
            - {name: KC_HOSTNAME, value: "https://tarots.tadamoo.com/auth"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HTTP_RELATIVE_PATH, value: /auth}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: keycloak-admin-password}}
            # Su un server carico l'import del realm dura più dei 5 minuti che
            # Narayana concede a una transazione («Transaction Reaper»: la
            # cancella, e Keycloak non parte), e il pool attende 5 s una
            # connessione. Sono proprietà Quarkus: valgono anche da ambiente.
            - {name: QUARKUS_TRANSACTION_MANAGER_DEFAULT_TRANSACTION_TIMEOUT, value: "3600"}
            - {name: QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT, value: "120"}
            # Segnaposto del realm di produzione (deploy/keycloak/README.md).
            - {name: KC_URL_WEB, value: "https://tarots.tadamoo.com"}
            - {name: KC_URL_ADMIN, value: "https://tarots.tadamoo.com/admin"}
            - name: KC_API_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: api-client-secret}}
            # Provider social spenti (KC_<P>_ENABLED vale false se manca): i
            # segnaposto degli id e dei segreti si riempiono comunque, perché
            # un `${...}` senza valore non venga letto alla lettera.
            - {name: KC_GOOGLE_ENABLED, value: "false"}
            - {name: KC_GOOGLE_CLIENT_ID, value: non-usato}
            - {name: KC_GOOGLE_CLIENT_SECRET, value: non-usato}
            - {name: KC_FACEBOOK_ENABLED, value: "false"}
            - {name: KC_FACEBOOK_CLIENT_ID, value: non-usato}
            - {name: KC_FACEBOOK_CLIENT_SECRET, value: non-usato}
            - {name: KC_APPLE_ENABLED, value: "false"}
            - {name: KC_APPLE_CLIENT_ID, value: non-usato}
            - {name: KC_APPLE_CLIENT_SECRET, value: non-usato}
            # Nessun SMTP: gli utenti si creano già con l'email verificata.
            - {name: KC_SMTP_HOST, value: localhost}
            - {name: KC_SMTP_PORT, value: "25"}
            - {name: KC_SMTP_FROM, value: "noreply@tarots.tadamoo.com"}
            - {name: KC_SMTP_USER, value: ""}
            - {name: KC_SMTP_PASSWORD, value: ""}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          # La prima volta Keycloak crea lo schema nel database (~150 changeset) e
          # importa il realm: sul server carico di tadamoo sono decine di minuti,
          # e un probe troppo corto lo riavvia a metà.
          startupProbe:
            httpGet: {path: /auth/realms/tarots, port: 8080}
            periodSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet: {path: /auth/realms/tarots, port: 8080}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 1536Mi}
      volumes:
        - name: realm
          configMap: {name: tarots-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-keycloak
  namespace: tarots
  labels: {app: tarots, component: keycloak}
spec:
  type: ClusterIP
  selector: {app: tarots, component: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# -------------------------------------------------------------------- api ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-api
  namespace: tarots
  labels: {app: tarots, component: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tarots, component: api}
  template:
    metadata:
      labels: {app: tarots, component: api}
    spec:
      containers:
        - name: api
          image: tarots-api:v2
          imagePullPolicy: IfNotPresent
          # Il CMD dell'immagine applica le migrazioni e poi serve.
          env:
            - name: TAROT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: database-url}}
            # Nessun modello finto: senza un modello vero le letture rispondono
            # 503 e non addebitano nulla. Il modello si configura nel Secret
            # opzionale `tarots-llm` (vedi `envFrom` sotto).
            - {name: TAROT_ENVIRONMENT, value: prod}
            - {name: TAROT_AUTH_DISABLED, value: "false"}
            # Nessun fornitore di pagamento: il simulato lascerebbe attivare
            # qualunque piano senza pagare.
            - {name: TAROT_BILLING_PROVIDER, value: disattivato}
            - {name: TAROT_TRACING_ENABLED, value: "false"}
            - {name: TAROT_KEYCLOAK_URL, value: "http://tarots-keycloak:8080/auth"}
            - {name: TAROT_KEYCLOAK_ISSUER_URL, value: "https://tarots.tadamoo.com/auth"}
            - {name: TAROT_KEYCLOAK_REALM, value: tarots}
            - {name: TAROT_API_PUBLIC_URL, value: "https://tarots.tadamoo.com/api"}
            - {name: TAROT_WEB_PUBLIC_URL, value: "https://tarots.tadamoo.com"}
            - {name: TAROT_CORS_ORIGINS, value: '["https://tarots.tadamoo.com"]'}
            # Letto dal seed: i crediti degli utenti di prova.
            - {name: TAROT_CREDITI_UTENTE_DI_PROVA, value: "100000"}
            # Il sale delle impronte anonime di chi visita un link condiviso: senza,
            # in produzione l'API rifiuta di partire. Chiave da aggiungere al Secret
            # (vedi LEGGIMI.md, passo 3).
            - name: TAROT_CONDIVISIONE_SALE
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: condivisione-sale}}
          # Il modello, dal Secret `tarots-llm` (facoltativo: se manca il
          # servizio parte e dice «non pronto»). Le chiavi sono le variabili
          # TAROT_*, per esempio:
          #   kubectl -n tarots create secret generic tarots-llm \
          #     --from-literal=TAROT_LLM_PROVIDER=anthropic \
          #     --from-literal=TAROT_ANTHROPIC_API_KEY=... \
          #     --from-literal=TAROT_ANTHROPIC_MODEL=claude-sonnet-5
          # oppure TAROT_MODELLI (JSON) per più modelli da assegnare ai compiti
          # dalla console. Poi: kubectl -n tarots rollout restart deploy/tarots-api
          envFrom:
            - secretRef: {name: tarots-llm, optional: true}
          ports:
            - {name: http, containerPort: 8100}
          startupProbe:
            httpGet: {path: /healthz, port: 8100}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /healthz, port: 8100}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8100}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-api
  namespace: tarots
  labels: {app: tarots, component: api}
spec:
  type: ClusterIP
  selector: {app: tarots, component: api}
  ports:
    - {name: http, port: 8100, targetPort: 8100}
---
# -------------------------------------------------------------------- web ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-web
  namespace: tarots
  labels: {app: tarots, component: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tarots, component: web}
  template:
    metadata:
      labels: {app: tarots, component: web}
    spec:
      containers:
        - name: web
          # Gli indirizzi pubblici (API, Keycloak) sono cotti nella build:
          # vedi le --build-arg in deploy/k8s/LEGGIMI.md.
          image: tarots-web:v2
          imagePullPolicy: IfNotPresent
          env:
            # Il server di Next legge le anteprime delle letture condivise
            # dall'interno del cluster, senza uscire dal gateway.
            - {name: API_INTERNAL_URL, value: "http://tarots-api:8100"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-web
  namespace: tarots
  labels: {app: tarots, component: web}
spec:
  type: ClusterIP
  selector: {app: tarots, component: web}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
# ------------------------------------------------------------------ admin ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-admin
  namespace: tarots
  labels: {app: tarots, component: admin}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tarots, component: admin}
  template:
    metadata:
      labels: {app: tarots, component: admin}
    spec:
      containers:
        - name: admin
          # La console, costruita con basePath /admin e client tarot-admin
          # (vedi le --build-arg in deploy/k8s/LEGGIMI.md).
          image: tarots-admin:v2
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /admin, port: 3000}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-admin
  namespace: tarots
  labels: {app: tarots, component: admin}
spec:
  type: ClusterIP
  selector: {app: tarots, component: admin}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
