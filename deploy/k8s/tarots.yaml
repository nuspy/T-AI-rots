  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app: tarots, component: cancellazioni}
        spec:
          restartPolicy: Never
          containers:
            - name: cancellazioni
              image: tarots-api:v9.5
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "tarot_core.tools.cancellazioni"]
              env:
                - name: TAROT_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: database-url}}
                - {name: TAROT_ENVIRONMENT, value: prod}
                - {name: TAROT_AUTH_DISABLED, value: "false"}
                - {name: TAROT_BILLING_PROVIDER, value: disattivato}
                - {name: TAROT_TRACING_ENABLED, value: "false"}
                - {name: TAROT_KEYCLOAK_URL, value: "http://tarots-keycloak:8080/auth"}
                - {name: TAROT_KEYCLOAK_REALM, value: tarots}
                - {name: TAROT_KEYCLOAK_CLIENT_ID, value: tarot-api}
                - name: TAROT_KEYCLOAK_CLIENT_SECRET
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: api-client-secret}}
                # Richiesti dal controllo di produzione delle impostazioni, anche se qui non servono tutti.
                - name: TAROT_CONDIVISIONE_SALE
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: condivisione-sale, optional: true}}
                - name: TAROT_LLM_PROVIDER_KEY
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: llm-provider-key}}
                - name: TAROT_IP_HASH_SECRET
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: ip-hash-secret, optional: true}}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
---
# Il segreto di «Accedi con Apple» (v9, Fase 6): il 1° di ogni mese alle 4:40 (ora italiana). Apple non accetta un
# segreto fisso ma un JWT firmato con la chiave .p8 caricata in console («Accesso con i social» → Apple), valido al
# massimo sei mesi: se quello scritto in Keycloak scade fra meno di 75 giorni se ne firma uno nuovo e lo si scrive
# nell'identity provider `apple` (`tarot_core/tools/apple_segreto.py`). Senza configurazione in console non fa niente.
# Serve la chiave master (decifra la .p8) e il segreto del client `tarot-api` (manage-identity-providers).
# Prova a mano: kubectl -n tarots create job --from=cronjob/tarots-apple-segreto prova-apple
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tarots-apple-segreto
  namespace: tarots
  labels: {app: tarots, component: apple-segreto}
spec:
  schedule: "40 4 1 * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app: tarots, component: apple-segreto}
        spec:
          restartPolicy: Never
          containers:
            - name: apple-segreto
              image: tarots-api:v9.5
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "tarot_core.tools.apple_segreto"]
              env:
                - name: TAROT_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: database-url}}
                - {name: TAROT_ENVIRONMENT, value: prod}
                - {name: TAROT_AUTH_DISABLED, value: "false"}
                - {name: TAROT_BILLING_PROVIDER, value: disattivato}
                - {name: TAROT_TRACING_ENABLED, value: "false"}
                - {name: TAROT_KEYCLOAK_URL, value: "http://tarots-keycloak:8080/auth"}
                - {name: TAROT_KEYCLOAK_REALM, value: tarots}
                - {name: TAROT_KEYCLOAK_CLIENT_ID, value: tarot-api}
                - name: TAROT_KEYCLOAK_CLIENT_SECRET
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: api-client-secret}}
                # Richiesti dal controllo di produzione delle impostazioni; la chiave master decifra la .p8.
                - name: TAROT_CONDIVISIONE_SALE
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: condivisione-sale, optional: true}}
                - name: TAROT_LLM_PROVIDER_KEY
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: llm-provider-key}}
                - name: TAROT_IP_HASH_SECRET
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: ip-hash-secret, optional: true}}
              resources:
                requests: {cpu: 20m, memory: 96Mi}
                limits: {memory: 384Mi}
