# -------------------------------------------------------------------- web ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-web
  namespace: tarots
  labels: {app: tarots, component: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tarots, component: web}
  template:
    metadata:
      labels: {app: tarots, component: web}
    spec:
      containers:
        - name: web
          # Gli indirizzi pubblici (API, Keycloak) sono cotti nella build:
          # vedi le --build-arg in deploy/k8s/LEGGIMI.md.
          image: tarots-web:v9.5
          imagePullPolicy: IfNotPresent
          env:
            # Il server di Next legge le anteprime delle letture condivise
            # dall'interno del cluster, senza uscire dal gateway.
            - {name: API_INTERNAL_URL, value: "http://tarots-api:8100"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          livenessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-web
  namespace: tarots
  labels: {app: tarots, component: web}
spec:
  type: ClusterIP
  selector: {app: tarots, component: web}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
