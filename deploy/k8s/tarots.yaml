# TAROTS chat su k3s: namespace `tarots`, sotto un solo dominio (tarots.chat).
#
#   /        -> sito Next.js          (tarots-web:3000)
#   /api/    -> API FastAPI           (tarots-api:8100, il prefisso /api si toglie)
#   /admin   -> console admin         (tarots-admin:3000, Next.js con basePath /admin)
#   /auth/   -> Keycloak              (tarots-keycloak:8080, KC_HTTP_RELATIVE_PATH=/auth)
#
# Il dominio è uno solo (`tarots.chat`; `www.tarots.chat` e il vecchio
# `tarots.tadamoo.com` sono reindirizzamenti permanenti, vedi LEGGIMI.md). Davanti a
# tutto sta nginx-proxy-manager (TLS Let's Encrypt), che inoltra l'intero host
# al servizio `tarots-gateway:8080`: le regole di percorso vivono qui, in un
# posto solo, e non nella console di NPM.
#
# Non contiene segreti: `tarots-secrets` e `tarots-realm` si creano a parte
# (vedi deploy/k8s/LEGGIMI.md). Le immagini si costruiscono sul server e si
# importano in containerd: non c'è un registry (come per autoskill).

apiVersion: v1
kind: Namespace
metadata:
  name: tarots
---
# ---------------------------------------------------------------- gateway ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tarots-gateway
  namespace: tarots
data:
  default.conf: |
    # NPM ha già terminato il TLS: lo schema originale arriva in X-Forwarded-Proto.
    map $http_x_forwarded_proto $schema_originale {
      default $http_x_forwarded_proto;
      ""      $scheme;
    }

    server {
      listen 8080;
      server_name _;
      client_max_body_size 5m;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $schema_originale;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Real-IP $http_x_real_ip;

      # La console di Keycloak e il realm master non sono pubblici: si usano
      # con `kubectl -n tarots port-forward deploy/tarots-keycloak 8081:8080`.
      location ~ ^/auth/(admin|realms/master)(/|$) {
        return 403;
      }

      location /auth/ {
        proxy_pass http://tarots-keycloak:8080;
        # Le intestazioni dei token di Keycloak sono grosse.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
      }

      # Il responso arriva a pezzi (streaming): senza `proxy_buffering off`
      # comparirebbe tutto insieme alla fine.
      location /api/ {
        proxy_pass http://tarots-api:8100/;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }

      # Le immagini dei mazzi dalla console: uno ZIP con le 78 carte e il
      # dorso (fino a 300 MB, `tarot/immagini_mazzo.py`) o i file di una
      # cartella uno per volta (fino a 25 MB). Solo qui il tetto è più alto.
      location /api/admin/decks/ {
        client_max_body_size 300m;
        proxy_pass http://tarots-api:8100/admin/decks/;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }

      # Le carte d'esempio dei candidati al voto: un'immagine per richiesta
      # (fino a 8 MB, come le immagini del blog).
      location /api/admin/voto/ {
        client_max_body_size 10m;
        proxy_pass http://tarots-api:8100/admin/voto/;
      }

      # La console di amministrazione: un'altra app Next.js, costruita con
      # basePath /admin, quindi il percorso passa com'è.
      location ~ ^/admin(/|$) {
        proxy_pass http://tarots-admin:3000;
      }

      location / {
        proxy_pass http://tarots-web:3000;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-gateway
  namespace: tarots
  labels: {app: tarots, component: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tarots, component: gateway}
  template:
    metadata:
      labels: {app: tarots, component: gateway}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: conf
          configMap: {name: tarots-gateway}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-gateway
  namespace: tarots
  labels: {app: tarots, component: gateway}
spec:
  type: ClusterIP
  selector: {app: tarots, component: gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# --------------------------------------------------------------- keycloak ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-keycloak
  namespace: tarots
  labels: {app: tarots, component: keycloak}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: tarots, component: keycloak}
  template:
    metadata:
      labels: {app: tarots, component: keycloak}
    spec:
      containers:
        - name: keycloak
          # deploy/keycloak/Dockerfile: Keycloak 26 già costruito per Postgres,
          # health e percorso /auth. Costruito sul server, senza registry.
          # v5: il tema `tarots` nello stile della v2 (login, registrazione, 2FA, pulsanti social).
          image: tarots-keycloak:v7
          imagePullPolicy: IfNotPresent
          # `start` (produzione), non `start-dev`: database vero, HTTPS dietro proxy.
          args: ["start", "--optimized", "--import-realm"]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://postgresql.tadamoo.svc.cluster.local:5432/tarots"}
            # Lo stesso database dell'API, in uno schema suo: un solo utente, un solo database.
            - {name: KC_DB_SCHEMA, value: keycloak}
            - {name: KC_DB_USERNAME, value: tarots}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: db-password}}
            - {name: KC_HOSTNAME, value: "https://tarots.chat/auth"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HTTP_RELATIVE_PATH, value: /auth}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: keycloak-admin-password}}
            # Su un server carico l'import del realm dura più dei 5 minuti che
            # Narayana concede a una transazione («Transaction Reaper»: la
            # cancella, e Keycloak non parte), e il pool attende 5 s una
            # connessione. Sono proprietà Quarkus: valgono anche da ambiente.
            - {name: QUARKUS_TRANSACTION_MANAGER_DEFAULT_TRANSACTION_TIMEOUT, value: "3600"}
            - {name: QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT, value: "120"}
            # Segnaposto del realm di produzione (deploy/keycloak/README.md).
            - {name: KC_URL_WEB, value: "https://tarots.chat"}
            - {name: KC_URL_ADMIN, value: "https://tarots.chat/admin"}
            - name: KC_API_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: api-client-secret}}
            # Provider social spenti (KC_<P>_ENABLED vale false se manca): i
            # segnaposto degli id e dei segreti si riempiono comunque, perché
            # un `${...}` senza valore non venga letto alla lettera. Servono
            # solo all'import di un realm nuovo: le credenziali vere si mettono
            # dalla console («Accesso con i social»), che le scrive in Keycloak.
            - {name: KC_GOOGLE_ENABLED, value: "false"}
            - {name: KC_GOOGLE_CLIENT_ID, value: non-usato}
            - {name: KC_GOOGLE_CLIENT_SECRET, value: non-usato}
            - {name: KC_FACEBOOK_ENABLED, value: "false"}
            - {name: KC_FACEBOOK_CLIENT_ID, value: non-usato}
            - {name: KC_FACEBOOK_CLIENT_SECRET, value: non-usato}
            - {name: KC_APPLE_ENABLED, value: "false"}
            - {name: KC_APPLE_CLIENT_ID, value: non-usato}
            - {name: KC_APPLE_CLIENT_SECRET, value: non-usato}
            - {name: KC_MICROSOFT_ENABLED, value: "false"}
            - {name: KC_MICROSOFT_CLIENT_ID, value: non-usato}
            - {name: KC_MICROSOFT_CLIENT_SECRET, value: non-usato}
            - {name: KC_GITHUB_ENABLED, value: "false"}
            - {name: KC_GITHUB_CLIENT_ID, value: non-usato}
            - {name: KC_GITHUB_CLIENT_SECRET, value: non-usato}
            - {name: KC_LINKEDIN_ENABLED, value: "false"}
            - {name: KC_LINKEDIN_CLIENT_ID, value: non-usato}
            - {name: KC_LINKEDIN_CLIENT_SECRET, value: non-usato}
            - {name: KC_TWITTER_ENABLED, value: "false"}
            - {name: KC_TWITTER_CLIENT_ID, value: non-usato}
            - {name: KC_TWITTER_CLIENT_SECRET, value: non-usato}
            # Stalwart Mail Server (v6): container Docker "stalwart-mail" sullo stesso host,
            # dominio tarots.chat, submission SMTPS implicito (465) — porta 587/STARTTLS non ha un
            # listener attivo su questa immagine, per questo si usa 465+ssl invece del piu' comune
            # 587+starttls. Il segreto della password sta in tarots-secrets (chiave smtp-password),
            # da creare a parte: `kubectl -n tarots create secret generic tarots-secrets
            # --from-literal=smtp-password='...' --dry-run=client -o yaml | kubectl apply -f -`
            # (o un patch se il Secret esiste gia' con altre chiavi). Applicato live sul realm via
            # kcadm il 2026-09-28; questi valori servono solo a un futuro reimport del realm.
            - {name: KC_SMTP_HOST, value: mail.tadamoo.com}
            - {name: KC_SMTP_PORT, value: "465"}
            - {name: KC_SMTP_FROM, value: "noreply@tarots.chat"}
            - {name: KC_SMTP_USER, value: "noreply@tarots.chat"}
            - name: KC_SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: smtp-password}}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          # La prima volta Keycloak crea lo schema nel database (~150 changeset) e
          # importa il realm: sul server carico di tadamoo sono decine di minuti,
          # e un probe troppo corto lo riavvia a metà.
          startupProbe:
            httpGet: {path: /auth/realms/tarots, port: 8080}
            periodSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet: {path: /auth/realms/tarots, port: 8080}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 1536Mi}
      volumes:
        - name: realm
          configMap: {name: tarots-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-keycloak
  namespace: tarots
  labels: {app: tarots, component: keycloak}
spec:
  type: ClusterIP
  selector: {app: tarots, component: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# -------------------------------------------------------------------- api ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarots-api
  namespace: tarots
  labels: {app: tarots, component: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tarots, component: api}
  template:
    metadata:
      labels: {app: tarots, component: api}
    spec:
      containers:
        - name: api
          image: tarots-api:v9.5
          imagePullPolicy: IfNotPresent
          # Il CMD dell'immagine applica le migrazioni e poi serve.
          env:
            - name: TAROT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: database-url}}
            # Nessun modello finto: senza un modello vero le letture rispondono
            # 503 e non addebitano nulla. I fornitori si aggiungono dalla
            # console («Modelli»); il Secret opzionale `tarots-llm` (vedi
            # `envFrom` sotto) resta solo un ripiego finché nessuno è stato
            # ancora configurato lì.
            - {name: TAROT_ENVIRONMENT, value: prod}
            - {name: TAROT_AUTH_DISABLED, value: "false"}
            # Nessun fornitore di pagamento: il simulato lascerebbe attivare
            # qualunque piano senza pagare. Dalla v9 (Fase 2c) fornitore e chiavi di Stripe si scelgono dalla
            # console (Pagamenti → Stripe): questo valore e le chiavi qui sotto sono solo il ripiego, copiati
            # nel database al primo avvio (LEGGIMI.md, «Stripe»).
            - {name: TAROT_BILLING_PROVIDER, value: disattivato}
            # Stripe (v9): ripiego facoltativo; le chiavi si incollano in console.
            - name: TAROT_STRIPE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: stripe-secret-key, optional: true}}
            - name: TAROT_STRIPE_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: stripe-webhook-secret, optional: true}}
            - {name: TAROT_TRACING_ENABLED, value: "false"}
            - {name: TAROT_KEYCLOAK_URL, value: "http://tarots-keycloak:8080/auth"}
            - {name: TAROT_KEYCLOAK_ISSUER_URL, value: "https://tarots.chat/auth"}
            - {name: TAROT_KEYCLOAK_REALM, value: tarots}
            # Il client `tarot-api` e il suo segreto (lo stesso che Keycloak riceve come KC_API_CLIENT_SECRET):
            # la console li usa per cambiare su Keycloak il login persistente e l'accesso con i social
            # (auth/keycloak_admin.py). Senza, quelle due pagine rispondono «TAROT_KEYCLOAK_CLIENT_SECRET non
            # impostato». Il suo account di servizio deve avere manage-realm e manage-identity-providers
            # (LEGGIMI.md, «Aggiornare il realm esistente»).
            - {name: TAROT_KEYCLOAK_CLIENT_ID, value: tarot-api}
            - name: TAROT_KEYCLOAK_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: api-client-secret}}
            - {name: TAROT_API_PUBLIC_URL, value: "https://tarots.chat/api"}
            - {name: TAROT_WEB_PUBLIC_URL, value: "https://tarots.chat"}
            - {name: TAROT_CORS_ORIGINS, value: '["https://tarots.chat"]'}
            # Letto dal seed: i crediti degli utenti di prova.
            - {name: TAROT_CREDITI_UTENTE_DI_PROVA, value: "100000"}
            # Il sale delle impronte anonime di chi visita un link condiviso. Facoltativo dalla v9 (Fase 2c):
            # senza, al primo avvio l'API ne genera uno e lo conserva cifrato nel database; se c'è, vale questo.
            - name: TAROT_CONDIVISIONE_SALE
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: condivisione-sale, optional: true}}
            # GDPR, Fase 1: il segreto dell'impronta HMAC degli IP (registro e consensi tengono l'IP troncato più questa
            # impronta, mai l'intero). Facoltativo dalla v9 (Fase 2c): senza, se ne genera uno al primo avvio
            # (conservato cifrato nel database); se c'è, vale questo e si copia nel database. Non cambiarlo dopo.
            - name: TAROT_IP_HASH_SECRET
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: ip-hash-secret, optional: true}}
            # Cifra le chiavi dei fornitori LLM a riposo nel database (i fornitori si aggiungono dalla console, non
            # da qui). Senza, in produzione l'API rifiuta di partire. Una chiave Fernet vera, generata con
            # `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"` — non un
            # valore casuale qualunque — e aggiunta al Secret (vedi LEGGIMI.md, passo 3).
            - name: TAROT_LLM_PROVIDER_KEY
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: llm-provider-key}}
            # Notifica ai motori di ricerca (v8): servono anche qui per il pulsante «Invia ora» della console.
            # Stessi valori del CronJob `tarots-notifica-motori` più sotto.
            - {name: TAROT_INDEXNOW_CHIAVE, value: "5cad0a576d0c2f1d8f9ec214451b07f1"}
            - {name: TAROT_WEBSUB_HUB, value: "https://pubsubhubbub.appspot.com/"}
            - {name: TAROT_SEARCH_CONSOLE_PROPRIETA, value: "sc-domain:tarots.chat"}
            - {name: TAROT_SEARCH_CONSOLE_CREDENZIALI, value: /segreti/search-console/credentials.json}
            # Analytics (v8, lanterna): paese e città dal file DB-IP scaricato nell'immagine.
            - {name: TAROT_ANALYTICS_GEO, value: /opt/geo/citta.mmdb}
            # Posta in uscita (rapporto analytics, email agli utenti): lo Stalwart di Keycloak. Dalla v9 (Fase 2c) si
            # imposta in console (Impostazioni → Posta in uscita): questi valori sono il ripiego, copiati nel
            # database (password cifrata) al primo avvio.
            - {name: TAROT_SMTP_HOST, value: mail.tadamoo.com}
            - {name: TAROT_SMTP_PORTA, value: "465"}
            - {name: TAROT_SMTP_UTENTE, value: "noreply@tarots.chat"}
            - {name: TAROT_SMTP_MITTENTE, value: "noreply@tarots.chat"}
            - name: TAROT_SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: tarots-secrets, key: smtp-password}}
            # Backup sul NAS (v8.3): la console prova il collegamento, lancia un backup e ripristina. La credenziale
            # si carica in console (v9, Fase 2c, cifrata); il Secret `tarots-backup` (chiave SSH come file, oppure una
            # password) è il ripiego facoltativo, copiato nel database al primo avvio.
            - {name: TAROT_BACKUP_CHIAVE_SSH, value: /etc/tarots-backup/ssh-key}
            - name: TAROT_BACKUP_PASSWORD
              valueFrom: {secretKeyRef: {name: tarots-backup, key: password, optional: true}}
          volumeMounts:
            - {name: search-console, mountPath: /segreti/search-console, readOnly: true}
            - {name: backup-nas, mountPath: /etc/tarots-backup, readOnly: true}
          # Ripiego per lo sviluppo locale o per un impianto senza ancora un fornitore in console: le chiavi sono le
          # variabili TAROT_*, per esempio:
          #   kubectl -n tarots create secret generic tarots-llm \
          #     --from-literal=TAROT_LLM_PROVIDER=anthropic \
          #     --from-literal=TAROT_ANTHROPIC_API_KEY=... \
          #     --from-literal=TAROT_ANTHROPIC_MODEL=claude-sonnet-5
          # oppure TAROT_MODELLI (JSON) per più modelli. Si legge solo finché la console non ne ha uno attivo.
          # Poi: kubectl -n tarots rollout restart deploy/tarots-api
          envFrom:
            - secretRef: {name: tarots-llm, optional: true}
          ports:
            - {name: http, containerPort: 8100}
          startupProbe:
            httpGet: {path: /healthz, port: 8100}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /healthz, port: 8100}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8100}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      # Il processo gira come utente 1000: il gruppo gli lascia leggere la chiave del NAS (0440), nessun altro.
      securityContext: {fsGroup: 1000}
      volumes:
        # Il JSON del service account Google per la Search Console. Facoltativo: senza il Secret il
        # canale Google si salta (vedi LEGGIMI.md, "Notifica ai motori di ricerca").
        - name: search-console
          secret: {secretName: tarots-search-console, optional: true}
        - name: backup-nas
          secret: {secretName: tarots-backup, optional: true, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: tarots-api
  namespace: tarots
  labels: {app: tarots, component: api}
spec:
  type: ClusterIP
  selector: {app: tarots, component: api}
  ports:
    - {name: http, port: 8100, targetPort: 8100}
---
# Abbonamenti (v9): ogni ora rinnova i piani interni (gratuiti, regalati) arrivati a fine periodo, chiude i disdetti,
# fa scadere i sospesi non saldati e gli abbonamenti Stripe rimasti senza rinnovo da una settimana (webhook persi), e
# riporta chi resta senza piano sul gratuito. Quelli di Stripe li rinnova Stripe (webhook `invoice.paid`): questo giro
# non li tocca, e rieseguirlo è innocuo (`tarot_core/tools/abbonamenti.py`). Il fornitore dev'essere lo stesso dell'API.
# Fase 2b: anche la tolleranza dei pagamenti falliti (solleciti al 3° e 6° giorno, sospensione alla fine) e il
# promemoria della prova due giorni prima, con le email (una volta sola per chiave, registro `invii_email`).
# Prova a mano: kubectl -n tarots create job --from=cronjob/tarots-abbonamenti prova-abbonamenti
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tarots-abbonamenti
  namespace: tarots
  labels: {app: tarots, component: abbonamenti}
spec:
  schedule: "7 * * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app: tarots, component: abbonamenti}
        spec:
          restartPolicy: Never
          containers:
            - name: abbonamenti
              image: tarots-api:v9.5
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "tarot_core.tools.abbonamenti"]
              env:
                - name: TAROT_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: database-url}}
                - {name: TAROT_ENVIRONMENT, value: prod}
                - {name: TAROT_AUTH_DISABLED, value: "false"}
                # Lo stesso dell'API: con `stripe` anche qui.
                - {name: TAROT_BILLING_PROVIDER, value: disattivato}
                - name: TAROT_STRIPE_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: stripe-secret-key, optional: true}}
                - name: TAROT_STRIPE_WEBHOOK_SECRET
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: stripe-webhook-secret, optional: true}}
                - {name: TAROT_TRACING_ENABLED, value: "false"}
                - {name: TAROT_WEB_PUBLIC_URL, value: "https://tarots.chat"}
                - {name: TAROT_API_PUBLIC_URL, value: "https://tarots.chat/api"}
                # Richiesti dal controllo di produzione delle impostazioni, anche se qui non servono.
                - name: TAROT_CONDIVISIONE_SALE
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: condivisione-sale, optional: true}}
                - name: TAROT_LLM_PROVIDER_KEY
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: llm-provider-key}}
                # Fase 2b: le email agli abbonati (solleciti, sospensione, promemoria della prova, rinnovo avvenuto).
                - {name: TAROT_SMTP_HOST, value: mail.tadamoo.com}
                - {name: TAROT_SMTP_PORTA, value: "465"}
                - {name: TAROT_SMTP_UTENTE, value: "noreply@tarots.chat"}
                - {name: TAROT_SMTP_MITTENTE, value: "noreply@tarots.chat"}
                - name: TAROT_SMTP_PASSWORD
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: smtp-password}}
              resources:
                requests: {cpu: 20m, memory: 96Mi}
                limits: {memory: 384Mi}
