---
# Backup del database sul NAS (v8.3): ogni notte alle 2:30 (ora italiana) `pg_dump` del database `tarots` intero
# (app, schema keycloak, immagini) → SFTP sul NAS nella tailnet, sette copie. Destinazione e accensione dalla
# console (Backup); la credenziale nel Secret `tarots-backup`. Se fallisce: Job fallito ed email di avviso.
# Prova a mano: kubectl -n tarots create job --from=cronjob/tarots-backup prova-backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tarots-backup
  namespace: tarots
  labels: {app: tarots, component: backup}
spec:
  schedule: "30 2 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {app: tarots, component: backup}
        spec:
          restartPolicy: Never
          securityContext: {fsGroup: 1000}
          containers:
            - name: backup
              image: tarots-api:v9.5
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "tarot_core.tools.backup_db"]
              env:
                - name: TAROT_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: database-url}}
                - {name: TAROT_ENVIRONMENT, value: prod}
                - {name: TAROT_AUTH_DISABLED, value: "false"}
                - {name: TAROT_BILLING_PROVIDER, value: disattivato}
                - {name: TAROT_TRACING_ENABLED, value: "false"}
                - {name: TAROT_WEB_PUBLIC_URL, value: "https://tarots.chat"}
                # Richiesti dal controllo di produzione delle impostazioni, anche se qui non servono.
                - name: TAROT_CONDIVISIONE_SALE
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: condivisione-sale, optional: true}}
                - name: TAROT_LLM_PROVIDER_KEY
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: llm-provider-key}}
                - {name: TAROT_BACKUP_CHIAVE_SSH, value: /etc/tarots-backup/ssh-key}
                - name: TAROT_BACKUP_PASSWORD
                  valueFrom: {secretKeyRef: {name: tarots-backup, key: password, optional: true}}
                # L'avviso email quando il backup fallisce (ai destinatari del rapporto analytics).
                - {name: TAROT_SMTP_HOST, value: mail.tadamoo.com}
                - {name: TAROT_SMTP_PORTA, value: "465"}
                - {name: TAROT_SMTP_UTENTE, value: "noreply@tarots.chat"}
                - {name: TAROT_SMTP_MITTENTE, value: "noreply@tarots.chat"}
                - name: TAROT_SMTP_PASSWORD
                  valueFrom: {secretKeyRef: {name: tarots-secrets, key: smtp-password}}
              volumeMounts:
                - {name: backup-nas, mountPath: /etc/tarots-backup, readOnly: true}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 1Gi}
          volumes:
            - name: backup-nas
              secret: {secretName: tarots-backup, optional: true, defaultMode: 0440}
---
# Le cancellazioni degli account (GDPR, Fase 1): ogni notte alle 3:15 (ora italiana, dopo il backup) gli account la
# cui cancellazione è stata chiesta da più di 30 giorni e non annullata perdono l'utente in Keycloak e i dati
# personali; la contabilità resta pseudonimizzata (`tarot/cancellazione.py`). Un account per transazione: uno che
# fallisce (Keycloak giù) si riprova la notte dopo. Serve il segreto del client `tarot-api` (manage-users).
