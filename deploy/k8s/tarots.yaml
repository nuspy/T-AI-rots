# Riconciliazione degli acquisti nelle app (v9, Fase 4): ogni notte alle 4:20 (ora italiana) chiede a Google
# Play i rimborsi degli ultimi 30 giorni (`voidedpurchases.list` → storno dei crediti), riprova gli acquisti rimasti
# in attesa o non confermati, e rilegge da Apple la storia di chi ha comprato su iPhone negli ultimi 40 giorni
# (rinnovi o rimborsi di cui la notifica si è persa). Credenziali dalla console «App mobili» (cifrate: serve la
# chiave master). Uno store non configurato si salta. Idempotente: rieseguirlo non accredita né storna due volte.
# Prova a mano: kubectl -n tarots create job --from=cronjob/tarots-store-riconcilia prova-store
