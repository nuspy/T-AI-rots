parent=keycloak.v2

# Il foglio di PatternFly 5 (stylesCommon) resta quello del tema di base: questo lo ridisegna nello stile della v2.
styles=css/tarots-v7.css
# Il NOME del foglio cambia a ogni immagine con un tema diverso (tarots-v7 → tarots-v8 …): Keycloak serve le risorse
# del tema da /resources/<versione di Keycloak>/… con max-age di 30 giorni, e a parità di versione di Keycloak
# l'indirizzo resta lo stesso. Con lo stesso nome i browser che avevano già visto il login tengono il foglio vecchio
# sopra il guscio nuovo (successo col rilascio v9, tema v6 su Keycloak 26.0.8 come la v4). Stessa regola nell'account.

# Le lingue del sito che hanno i testi del tema (messages/messages_*.properties). Il realm deve offrire le stesse
# (`supportedLocales` in realm-tarots.json; nel realm già in produzione vedi deploy/k8s/LEGGIMI.md).
locales=en,it,hu,ru,uk,es

# Il guscio della pagina (testata, foglio, piede) è template.ftl; i pulsanti social sono social-providers.ftl.
# Le pagine (login.ftl, register.ftl, login-otp.ftl, login-config-totp.ftl, …) sono quelle di keycloak.v2.

# NIENTE `import=common/keycloak.v2`: quel pseudo-tema non esiste (il builtin "common" di Keycloak
# 26 si chiama "keycloak", non "keycloak.v2") — la riga faceva fallire il caricamento dell'intero
# tema con "Not found theme 'common/keycloak.v2'... using built-in themes", scoperto solo in
# produzione dopo il deploy (v5, Fase G): il redeploy non bastava, serviva questa correzione.
