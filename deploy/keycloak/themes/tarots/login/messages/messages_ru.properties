# Testi del tema `tarots` (login di Keycloak), UTF-8. Formato MessageFormat: l'apostrofo si scrive doppio.
# Le chiavi di Keycloak non ridefinite qui restano quelle del tema di base, già tradotte.
tarotsMotto=Живой опыт Таро: вопрос, ритуал, толкование и нить, которую ты решаешь сохранить.
tarotsOcchiello=Твой аккаунт
tarotsOppure=или
tarotsContinuaCon=Продолжить через {0}
tarotsTornaAlSito=Вернуться в TAROTS chat
tarotsPiede=Безопасный вход в TAROTS chat. Ты остаёшься в системе, пока не выйдешь.
tarotsSaltaAlModulo=Перейти к форме
tarotsCambiaAccount=Не ты? Сменить
# Один аккаунт на человека: тот же адрес = тот же аккаунт, по паролю или через соцсеть.
emailExistsMessage=Аккаунт с этим адресом уже существует — возможно, он создан через Google, Facebook или другую соцсеть. Войдите с помощью этой кнопки: это тот же аккаунт. Чтобы входить и по паролю, выберите «Забыли пароль?» или задайте пароль в своём аккаунте после входа.
usernameExistsMessage=Аккаунт с этим адресом уже существует — возможно, он создан через Google, Facebook или другую соцсеть. Войдите с помощью этой кнопки: это тот же аккаунт. Чтобы входить и по паролю, выберите «Забыли пароль?» или задайте пароль в своём аккаунте после входа.
invalidUserMessage=Неверный адрес или пароль. Если вы регистрировались через Google, Facebook или другую соцсеть, используйте эту кнопку: это тот же аккаунт.
federatedIdentityConfirmLinkMessage=Аккаунт с {0} {1} уже существует. Чтобы входить в него и так, подтвердите, что он ваш: войдите ещё раз по паролю или через уже привязанную соцсеть.
federatedIdentityConfirmReauthenticateMessage=Подтвердите, что аккаунт ваш, чтобы привязать его к {0}: войдите по паролю или через уже привязанную соцсеть.
confirmLinkIdpContinue=Это мой аккаунт: привязать
confirmLinkIdpReviewProfile=Проверить мои данные
# v9, Fase 6: il social è già di un altro account (di solito quello nato nell'app): il rimedio è il codice.
identityProviderAlreadyLinkedMessage=Этот аккаунт {0} уже привязан к другому аккаунту TAROTS chat (возможно, созданному в приложении). Вернитесь на сайт: в приложении откройте «Уже есть аккаунт на сайте?» и введите показанный код в профиле, в разделе «Способы входа».
