confirmLinkIdpReviewProfile=Adataim áttekintése
# v9, Fase 6: il social è già di un altro account (di solito quello nato nell'app): il rimedio è il codice.
identityProviderAlreadyLinkedMessage=Ez a(z) {0}-fiók már egy másik TAROTS chat fiókhoz kapcsolódik (talán az alkalmazásban létrehozotthoz). Térj vissza az oldalra: az alkalmazásban nyisd meg a «Van már fiókod az oldalon?» pontot, és a kapott kódot írd be a profilodban, a «Belépési módok» részben.

