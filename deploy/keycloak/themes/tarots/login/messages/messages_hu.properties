emailExistsMessage=Ezzel az e-mail-címmel már létezik fiók, talán Google-lal, Facebookkal vagy más közösségi fiókkal hozták létre. Lépj be azzal a gombbal: ugyanaz a fiók. Ha jelszót is szeretnél, válaszd az „Elfelejtett jelszó?” lehetőséget, vagy belépés után állítsd be a fiókodban.
usernameExistsMessage=Ezzel az e-mail-címmel már létezik fiók, talán Google-lal, Facebookkal vagy más közösségi fiókkal hozták létre. Lépj be azzal a gombbal: ugyanaz a fiók. Ha jelszót is szeretnél, válaszd az „Elfelejtett jelszó?” lehetőséget, vagy belépés után állítsd be a fiókodban.
invalidUserMessage=Érvénytelen e-mail-cím vagy jelszó. Ha Google-lal, Facebookkal vagy más közösségi fiókkal regisztráltál, azt a gombot használd: ugyanaz a fiók.
federatedIdentityConfirmLinkMessage=Már létezik fiók ezzel: {0} {1}. Hogy ezzel a belépéssel is használhasd, erősítsd meg, hogy a tiéd: még egyszer belépsz a jelszavaddal vagy egy már összekapcsolt közösségi fiókkal.
federatedIdentityConfirmReauthenticateMessage=Erősítsd meg, hogy a fiók a tiéd, és kapcsold össze ezzel: {0}. Lépj be a jelszavaddal vagy egy már összekapcsolt közösségi fiókkal.
