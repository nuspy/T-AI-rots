# Один обліковий запис на людину: та сама адреса = той самий обліковий запис.
emailExistsMessage=Обліковий запис із цією адресою вже існує — можливо, його створено через Google, Facebook або іншу соцмережу. Увійдіть за допомогою цієї кнопки: це той самий обліковий запис. Щоб входити й за паролем, оберіть «Забули пароль?» або встановіть пароль у своєму обліковому записі після входу.
usernameExistsMessage=Обліковий запис із цією адресою вже існує — можливо, його створено через Google, Facebook або іншу соцмережу. Увійдіть за допомогою цієї кнопки: це той самий обліковий запис. Щоб входити й за паролем, оберіть «Забули пароль?» або встановіть пароль у своєму обліковому записі після входу.
invalidUserMessage=Неправильна адреса або пароль. Якщо ви реєструвалися через Google, Facebook або іншу соцмережу, скористайтеся цією кнопкою: це той самий обліковий запис.
federatedIdentityConfirmLinkMessage=Обліковий запис із {0} {1} уже існує. Щоб входити до нього й так, підтвердіть, що він ваш: увійдіть ще раз за паролем або через уже прив’язану соцмережу.
federatedIdentityConfirmReauthenticateMessage=Підтвердіть, що обліковий запис ваш, щоб прив’язати його до {0}: увійдіть за паролем або через уже прив’язану соцмережу.
confirmLinkIdpContinue=Це мій: прив’язати
confirmLinkIdpReviewProfile=Переглянути мої дані
# v9, Fase 6: il social è già di un altro account (di solito quello nato nell'app): il rimedio è il codice.
identityProviderAlreadyLinkedMessage=Цей обліковий запис {0} уже прив’язаний до іншого облікового запису TAROTS chat (можливо, створеного в застосунку). Поверніться на сайт: у застосунку відкрийте «Вже маєте обліковий запис на сайті?» і введіть показаний код у профілі, у розділі «Способи входу».
