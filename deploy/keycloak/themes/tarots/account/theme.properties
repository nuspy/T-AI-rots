parent=keycloak.v3

# `keycloak.v3`, non `keycloak.v2`: in Keycloak 26 la console dell'account v2 non esiste più (keycloak.v2 c'è solo
# per il login). Con `parent=keycloak.v2` il tema falliva al caricamento («Not found parent theme 'keycloak.v2'»)
# e Keycloak ripiegava in silenzio su quello di serie: verificato su un Keycloak 26.0.8 locale.

# Copia ridotta del foglio di stile del login (deploy/keycloak/themes/tarots/login/resources/css/tarots-v7.css): un
# percorso relativo tra tipi di tema diversi non è garantito da Keycloak, meglio una copia locale.
styles=css/tarots-v7.css

# NIENTE `import=common/keycloak.v2`: vedi la nota nel theme.properties del login — quello pseudo-
# tema non esiste e faceva fallire il caricamento dell'intero tema.
